name: Teleschnecke check
on:
  push:
    paths:
      - "teleschnecke-app/**"
      - ".github/workflows/teleschnecke-check.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleschnecke-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teleschnecke-app/package.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
